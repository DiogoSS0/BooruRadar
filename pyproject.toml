[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booruradar"
version = "0.1.0"
description = "Metadata monitoring for public booru sites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "anyio>=4.6,<4.12",
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.29",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[project.scripts]
booruradar-api = "apps.api.main:run"
booruradar-worker = "apps.worker.main:main"

[tool.setuptools.packages.find]
include = ["apps*", "booruradar*"]

[tool.setuptools.package-data]
"apps.api" = ["static/*.css", "static/*.html", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
